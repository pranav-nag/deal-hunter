name: Store Scrapers

# schedule and workflow_dispatch only. Never pull_request or
# pull_request_target — this repo is public, and a fork PR must never be able
# to run with repository secrets in scope.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed state without sending alerts'
        type: boolean
        default: false
      only:
        description: 'Comma-separated source names, blank for all'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: stores
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A full pass measured ~22 minutes of real work: 12 sources in parallel, but
    # queries within a source are sequential so the per-host politeness delay in
    # fetch.ts applies. Leave headroom above that, and above the step timeout.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/node/package-lock.json

      - name: Install dependencies
        working-directory: src/node
        run: npm ci

      - name: Install Playwright chromium
        working-directory: src/node
        run: npx playwright install --with-deps chromium

      # Shorter than the job timeout on purpose. A hung pass then fails this
      # step while the job survives, so the commit below still runs and keeps
      # whatever state was already written. A job-level timeout would take the
      # commit with it.
      #
      # Must stay comfortably above the ~22 minutes a real pass takes. Set to 20
      # once, which killed a healthy pass two minutes from the finish line.
      - name: Run store pass
        timeout-minutes: 30
        working-directory: src/node
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. Unset means digest and system messages fall back to the
          # deals webhook rather than going missing.
          DISCORD_DIGEST_WEBHOOK_URL: ${{ secrets.DISCORD_DIGEST_WEBHOOK_URL }}
          # Inputs go through the environment, never interpolated straight into
          # the script: `${{ inputs.only }}` inline would let a dispatcher inject
          # shell through the input box.
          SEED_INPUT: ${{ inputs.seed }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          ARGS=""
          if [ "$SEED_INPUT" = "true" ]; then ARGS="$ARGS --seed"; fi
          if [ -n "$ONLY_INPUT" ]; then ARGS="$ARGS --only $ONLY_INPUT"; fi
          npx tsx bin/stores.ts $ARGS

      # Block scalar, not an inline one: the ": " inside the commit message
      # would otherwise be parsed as a YAML mapping and fail the workflow.
      #
      # always(), because uncommitted state is worse than partial state. Each
      # source writes its own files as it finishes, so a pass that dies halfway
      # still has real results on disk; without this they are thrown away and
      # the next pass re-diffs against a stale snapshot and re-alerts everything.
      - name: Commit state
        if: always()
        run: |
          bash scripts/commit-state.sh main "chore(state): store pass $(date -u +%Y-%m-%dT%H:%MZ)"
